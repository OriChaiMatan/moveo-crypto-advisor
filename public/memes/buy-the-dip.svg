        <rect x="550" y="450" width="18" height="80" rx="4"/>
    </g>

    <text x="60" y="215" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="30" fill="#94A3B8">The dip:</text>

    <text x="60" y="565" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="700" fill="#F8FAFC">keeps dipping</text>
</svg>
