<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Buy the dip. The dip: keeps dipping.">
    <rect width="800" height="600" fill="#0E1424"/>
    <rect x="0" y="0" width="800" height="8" fill="#EF4444"/>

    <text x="60" y="120" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="700" fill="#F8FAFC" letter-spacing="2">BUY THE DIP</text>

    <g stroke="#EF4444" stroke-width="10" stroke-linecap="round" fill="none">
        <path d="M70 300 L170 340 L270 320 L370 400 L470 380 L570 460 L670 500 L730 520"/>
